<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Собачий чат 🐾</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦮</text></svg>">
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:radial-gradient(circle at 20% 10%,#fff 0,#f6e9ff 35%,#dfe9ff 100%);
  color:#222;
}
.app{
  width:min(900px,94vw); height:min(760px,92vh); display:flex; flex-direction:column;
  background:#ffffffcc; backdrop-filter:blur(18px);
  border:1px solid #ffffff; border-radius:28px; overflow:hidden;
  box-shadow:0 25px 70px #5d5b7a33;
}
header{
  padding:20px 24px; display:flex; align-items:center; gap:15px;
  background:#ffffffaa; border-bottom:1px solid #ddd;
}
.avatar{
  width:58px;height:58px;border-radius:18px;display:grid;place-items:center;
  background:#ffe8a8;font-size:35px;box-shadow:inset 0 -5px #f4c95d;
}
h1{font-size:21px;margin:0}.status{font-size:13px;color:#6d6d78;margin-top:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#42c96b;margin-right:5px}
.chat{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px}
.msg{max-width:75%;padding:12px 16px;border-radius:19px;line-height:1.35;word-wrap:break-word;animation:pop .18s ease}
.cat{align-self:flex-start;background:#f0eef8;border-bottom-left-radius:5px}
.user{align-self:flex-end;background:#6957e8;color:white;border-bottom-right-radius:5px}
.time{font-size:10px;opacity:.55;margin-top:4px}
.typing{display:none;align-self:flex-start;background:#f0eef8;padding:12px 16px;border-radius:19px}
.typing span{display:inline-block;width:6px;height:6px;background:#777;border-radius:50%;margin:0 2px;animation:b .8s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.composer{padding:15px;display:flex;gap:10px;background:#ffffffaa;border-top:1px solid #ddd}
input{
  flex:1;border:1px solid #d8d5e3;border-radius:17px;padding:14px 16px;
  font-size:15px;outline:none;background:white;
}
input:focus{border-color:#7868eb;box-shadow:0 0 0 3px #7868eb22}
button{
  border:0;border-radius:17px;padding:0 20px;background:#6957e8;color:#fff;
  font-weight:700;font-size:15px;cursor:pointer;transition:.15s;
}
button:hover{transform:translateY(-1px);filter:brightness(1.05)}
button:active{transform:translateY(1px)}
.info{text-align:center;font-size:11px;color:#777;padding-bottom:10px}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}
@media(max-width:600px){.app{height:96vh;border-radius:20px}.msg{max-width:86%}button{padding:0 15px}.chat{padding:16px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🦮</div>
    <div>
      <h1>Макс</h1>
      <div class="status"><span class="dot"></span>онлайн друг</div>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="msg cat"><div>ГАВ!</div><div class="time">только что</div></div>
  </main>

  <div class="typing" id="typing"><span></span><span></span><span></span></div>
  <div class="info">Может цапнуть (редко)</div>

  <form class="composer" id="form">
    <input id="input" autocomplete="off" placeholder="Напишите что-нибудь максиму!">
    <button>Отправить</button>
  </form>
</div>

<script>
const replies = ["ГАВ!", "ГАВ!!", "👅", "КУСЬ!!","ЦАП!!", "..."];
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const form = document.getElementById("form");
const typing = document.getElementById("typing");

function time(){
  return new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}

function addMessage(text,type){
  const el=document.createElement("div");
  el.className="msg "+type;
  el.innerHTML=`<div></div><div class="time">${time()}</div>`;
  el.firstChild.textContent=text;
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;

  addMessage(text,"user");
  input.value="";
  typing.style.display="block";
  chat.appendChild(typing);
  chat.scrollTop=chat.scrollHeight;

  setTimeout(()=>{
    typing.style.display="none";
    const reply=replies[Math.floor(Math.random()*replies.length)];
    addMessage(reply,"cat");
  },500+Math.random()*700);
});

input.focus();
</script>
</body>
</html>
